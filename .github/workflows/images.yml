name: Container image

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  # Do not let a docs-only push cancel the last application publication.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Select source and deployment checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      compose: ${{ steps.filter.outputs.compose }}
      publish: ${{ github.event_name != 'pull_request' }}
      images: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || steps.filter.outputs.images == 'true' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Detect changes requiring image checks
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          # Compose changes test the pinned image; unknown paths build anew.
          filters: |
            images:
              - '!*.md'
              - '!docs/**/*.md'
              - '!compose.yaml'
            compose:
              - 'compose.yaml'

  docs:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.images != 'true' && needs.changes.outputs.compose != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check tracked Markdown links and anchors
        run: bin/check docs

  quick:
    name: Quick checks
    needs: changes
    if: needs.changes.outputs.images == 'true' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build development tools without production assets
        uses: docker/build-push-action@v7
        with:
          context: .
          target: development
          load: true
          tags: decidim-coolify:tools-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development

      - name: Run quick checks
        run: bin/check quick
        env:
          CHECK_TOOL_IMAGE: decidim-coolify:tools-${{ github.run_id }}-${{ github.run_attempt }}

  test:
    name: Read-only image checks
    needs: [changes, quick]
    if: needs.changes.outputs.compose == 'true' && needs.changes.outputs.images != 'true' || github.event_name == 'pull_request' && needs.changes.outputs.images == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-image.yml
    with:
      build: ${{ needs.changes.outputs.images == 'true' }}

  candidates:
    name: Build and verify registry candidates
    needs: [changes, quick]
    if: needs.changes.outputs.images == 'true' && needs.changes.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/verify-image.yml
    with:
      build: true
      publish: true

  ci:
    name: CI
    if: always()
    needs: [changes, docs, quick, test, candidates]
    runs-on: ubuntu-24.04
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGES_REQUIRED: ${{ needs.changes.outputs.images == 'true' || needs.changes.outputs.compose == 'true' }}
          DOCS_RESULT: ${{ needs.docs.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CANDIDATES_REQUIRED: ${{ needs.changes.outputs.images == 'true' && needs.changes.outputs.publish == 'true' }}
          CANDIDATES_RESULT: ${{ needs.candidates.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$IMAGES_REQUIRED" = true ]; then
            test "$DOCS_RESULT" = skipped
            test "$QUICK_RESULT" = success
            if [ "$CANDIDATES_REQUIRED" = true ]; then
              test "$TEST_RESULT" = skipped
              test "$CANDIDATES_RESULT" = success
            else
              test "$TEST_RESULT" = success
              test "$CANDIDATES_RESULT" = skipped
            fi
          else
            test "$DOCS_RESULT" = success
            test "$QUICK_RESULT" = skipped
            test "$TEST_RESULT" = skipped
            test "$CANDIDATES_RESULT" = skipped
          fi

  publish:
    name: Publish tested multi-architecture image
    needs: [changes, ci, candidates]
    # CI has intentionally skipped ancestors. Override the implicit success()
    # check, but require every publication prerequisite to have succeeded.
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.ci.result == 'success' && needs.candidates.result == 'success' &&
          needs.changes.outputs.images == 'true' && needs.changes.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
          flavor: latest=false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Assemble tested images without rebuilding
        id: publish
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            --metadata-file "$RUNNER_TEMP/published.json" \
            "$(cat "$RUNNER_TEMP/digests/amd64")" \
            "$(cat "$RUNNER_TEMP/digests/arm64")"
          digest=$(jq -er '.["containerimage.descriptor"].digest' "$RUNNER_TEMP/published.json")
          docker buildx imagetools inspect "$IMAGE_NAME@$digest" --raw > "$RUNNER_TEMP/manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "$RUNNER_TEMP/manifest.json"
          image="$IMAGE_NAME:sha-$GITHUB_SHA@$digest"
          python3 pin_release.py "$image"
          python3 validate.py
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf 'Published tested image: `%s`\n\nSource: `%s`\n\nPublication does not deploy.\n' \
            "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload matching deployment configuration
        uses: actions/upload-artifact@v7
        with:
          name: deployment-compose
          path: compose.yaml
          if-no-files-found: error
          overwrite: true

  propose:
    name: Propose the tested image on main
    needs: publish
    # Tags and manual builds on other branches publish for testing only.
    # Skipped ancestors must not suppress a successful main publication's PR.
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: application-image-update-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reject a superseded application build
        id: current
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          # Compose is tested again in the update PR. Prose and image-selection
          # commits may advance main without invalidating the application build.
          if git diff --quiet "$SOURCE_REVISION" HEAD -- . \
            ':(top,exclude)compose.yaml' ':(top,glob,exclude)*.md' \
            ':(top,glob,exclude)docs/**/*.md'; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo 'Source has been superseded; no update PR was changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Select the tested image
        if: steps.current.outputs.current == 'true'
        env:
          IMAGE_REFERENCE: ${{ needs.publish.outputs.image }}
        run: |
          python3 pin_release.py "$IMAGE_REFERENCE"
          python3 validate.py

      - name: Create or update the release selection PR
        if: steps.current.outputs.current == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: update-application-image
          add-paths: compose.yaml
          commit-message: 'build(coolify): select tested application image'
          title: 'build(coolify): select tested application image'
          body: |
            Select the application image built from `${{ github.sha }}`.

            Image: `${{ needs.publish.outputs.image }}`

            Both native architecture checks passed in [the publication run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Approve the workflow runs on this PR to check the selected digest with the current Compose configuration again.

            Review application changes and any migration or configuration requirements before merging.
            Merging selects the release for installation; Coolify deployment remains manual.
